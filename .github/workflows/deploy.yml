name: Deploy to GitHub Pages

# Assumes this angular-app folder is the root of its own GitHub repo.
# If it is a subfolder of a larger repo, move this file to the repo root's
# .github/workflows/, add `defaults: { run: { working-directory: angular-app } }`
# to the build job, and change the artifact path to angular-app/dist/documentation-app/browser.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        # base-href must match how Pages serves the repo: a project page is /<repo>/.
        # For a user/org root page (<user>.github.io) or a custom domain, use "/".
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
      - name: SPA fallback + nojekyll
        run: |
          cp dist/documentation-app/browser/index.html dist/documentation-app/browser/404.html
          touch dist/documentation-app/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/documentation-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
