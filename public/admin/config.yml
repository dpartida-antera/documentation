# Decap CMS configuration.
#
# LOGIN (live site): editors open /admin/ and click "Login with GitHub". That goes
# through the OAuth proxy set in `base_url` below (see cms-oauth/SETUP.md to deploy it).
# The GitHub account used must have write access to this repo.
#
# LOCAL EDITING (no login): run `npx decap-server` then `npm start`, open /admin/.
# `local_backend` makes Decap use the local files when on localhost.

backend:
  name: github
  repo: dpartida-antera/documentation
  branch: main
  # TODO: replace with your deployed OAuth proxy URL (no trailing slash).
  base_url: https://antera-cms-auth.dpartida.workers.dev
  auth_endpoint: auth

local_backend: true

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: guides
    label: Guides
    format: json
    files:
      - name: shipping
        label: PO Shipping Address Guide
        file: src/content/shipping-guide.json
        description: Text shown on the PO Shipping Address guide page.
        fields:
          - name: hero
            label: Header
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: lead, label: Intro paragraph, widget: markdown }
              - { name: pill, label: Pill badge text, widget: string }

          - name: sections
            label: Sections
            widget: object
            fields:
              - name: start
                label: "01 How shipping works"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }
                  - { name: info, label: Info callout (blue), widget: markdown }
                  - { name: body, label: Closing paragraph, widget: markdown }

              - name: docs
                label: "02 The three PO documents"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }
                  - name: cards
                    label: Document cards
                    widget: list
                    label_singular: Card
                    summary: "{{fields.tag}} – {{fields.title}}"
                    fields:
                      - { name: tag, label: Tag label, widget: string }
                      - { name: title, label: Card title, widget: string }
                      - { name: body, label: Card body, widget: markdown }
                  - { name: note, label: Note callout (yellow), widget: markdown }

              - name: flags
                label: "03 Settings & flags"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }
                  - name: table
                    label: Flags table rows
                    widget: list
                    label_singular: Row
                    summary: "{{fields.flag}}"
                    fields:
                      - { name: flag, label: Flag name, widget: string }
                      - { name: meaning, label: What it means, widget: markdown }
                      - { name: effect, label: Effect when ON, widget: markdown }

              - name: priority
                label: "04 Priority rules"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }
                  - name: cards
                    label: Priority cards
                    widget: list
                    label_singular: Card
                    summary: "{{fields.tag}} – {{fields.title}}"
                    fields:
                      - { name: tag, label: Tag label, widget: string }
                      - { name: title, label: Card title, widget: string }
                      - { name: body, label: Card body, widget: markdown }
                  - { name: note, label: Note callout (yellow), widget: markdown }

              - name: tool
                label: "05 Determination tool"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }

              - name: flows
                label: "06 Decision flowcharts"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }

              - name: scenarios
                label: "07 Scenario library"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }

              - name: glossary
                label: "08 Glossary"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - name: rows
                    label: Glossary entries
                    widget: list
                    label_singular: Entry
                    summary: "{{fields.term}}"
                    fields:
                      - { name: term, label: Term, widget: string }
                      - { name: definition, label: Definition, widget: markdown }

          - name: extra_sections
            label: Custom sections
            widget: list
            label_singular: Section
            summary: "{{fields.heading}}"
            fields:
              - { name: id, label: "Section ID (for anchor links, e.g. my-section)", widget: string }
              - { name: heading, label: Section heading, widget: string }
              - { name: lead, label: Lead paragraph, widget: markdown, required: false }
              - { name: info, label: Info callout (blue), widget: markdown, required: false }
              - { name: note, label: Note callout (yellow), widget: markdown, required: false }
              - { name: body, label: Body paragraph, widget: markdown, required: false }

          - { name: footer, label: Footer text, widget: string }

      - name: auto-allocation
        label: Auto Allocation Guide
        file: src/content/auto-allocation-guide.json
        description: Text shown on the Auto Allocation guide page.
        fields:
          - name: hero
            label: Header
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: lead, label: Intro paragraph, widget: markdown }
              - { name: pill, label: Pill badge text, widget: string }

          - name: sections
            label: Sections
            widget: object
            fields:
              - name: start
                label: "01 How auto-allocation works"
