                  - { name: info, label: Info callout (blue), widget: markdown }
                  - { name: body, label: Closing paragraph, widget: markdown }

              - name: prereq
                label: "02 Prerequisites"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }
                  - name: table
                    label: Prerequisites table rows
                    widget: list
                    label_singular: Row
                    summary: "{{fields.requirement}}"
                    fields:
                      - { name: requirement, label: Requirement, widget: string }
                      - { name: detail, label: Detail, widget: markdown }
                  - { name: note, label: Note callout (yellow), widget: markdown }

              - name: flags
                label: "03 Settings & flags"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }
                  - name: table
                    label: Settings table rows
                    widget: list
                    label_singular: Row
                    summary: "{{fields.setting}}"
                    fields:
                      - { name: setting, label: Setting name, widget: string }
                      - { name: what_it_does, label: What it does, widget: markdown }
                      - { name: where, label: Where to find it, widget: string }
                  - { name: locations_heading, label: Screenshot section heading, widget: string }
                  - { name: locations_subtitle, label: Screenshot section subtitle, widget: string }
                  - name: shots
                    label: Setting location screenshots
                    widget: list
                    label_singular: Screenshot
                    summary: "{{fields.title}}"
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: location, label: Location path, widget: string }
                      - { name: image, label: Screenshot image, widget: image }
                      - { name: alt, label: Alt text, widget: string }

              - name: outcomes
                label: "04 Allocation outcomes"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }
                  - name: cards
                    label: Outcome cards
                    widget: list
                    label_singular: Card
                    summary: "{{fields.tag}} – {{fields.title}}"
                    fields:
                      - { name: tag, label: Tag label, widget: string }
                      - { name: title, label: Card title, widget: string }
