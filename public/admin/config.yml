                    label: Warehouse priority table rows
                    widget: list
                    label_singular: Row
                    summary: "{{fields.order}} – {{fields.warehouse}}"
                    fields:
                      - { name: order, label: Priority order, widget: string }
                      - { name: warehouse, label: Warehouse, widget: string }
                      - { name: notes, label: Notes, widget: markdown }
                  - { name: info, label: Info callout (blue), widget: markdown }

              - name: parent
                label: "06 Parent to Child transfer"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }
                  - name: table
                    label: Transfer rules table rows
                    widget: list
                    label_singular: Row
                    summary: "{{fields.rule}}"
                    fields:
                      - { name: rule, label: Rule, widget: string }
                      - { name: behavior, label: Behavior, widget: markdown }
                  - { name: info, label: Info callout (blue), widget: markdown }

              - name: tool
                label: "07 Allocation simulator"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }

              - name: flows
                label: "08 Decision flowcharts"
                widget: object
                fields:
                  - { name: heading, label: Section heading, widget: string }
                  - { name: lead, label: Lead paragraph, widget: markdown }

          - name: extra_sections
            label: Custom sections
            widget: list
            label_singular: Section
            summary: "{{fields.heading}}"
            fields:
              - { name: id, label: "Section ID (for anchor links, e.g. my-section)", widget: string }
              - { name: heading, label: Section heading, widget: string }
              - { name: lead, label: Lead paragraph, widget: markdown, required: false }
              - { name: info, label: Info callout (blue), widget: markdown, required: false }
              - { name: note, label: Note callout (yellow), widget: markdown, required: false }
              - { name: body, label: Body paragraph, widget: markdown, required: false }

          - { name: footer, label: Footer text, widget: string }
